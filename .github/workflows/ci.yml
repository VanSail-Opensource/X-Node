name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests and schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting and module integrity
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go mod verify
          git diff --check
      - name: Race and real-kernel regressions
        # Xray's VLESS TLS splice paths use uintptr-based field offsets that checkptr rejects.
        run: go test -race -gcflags='github.com/xtls/xray-core/proxy/vless/...=-d=checkptr=0' -count=1 -coverprofile=coverage.out ./...
      - name: Source inventory RSS budget
        run: |
          go test -c -o /tmp/firewall-scale ./internal/firewall
          /usr/bin/time -f %M -o /tmp/firewall-rss /tmp/firewall-scale -test.run ^TestTenMillionSourceRecordsBoundedMemory$ -test.v
          echo "Source inventory peak RSS: $(cat /tmp/firewall-rss) KiB"
          test "$(cat /tmp/firewall-rss)" -le 262144
      - name: Static analysis
        run: go vet ./...
      - name: Telemetry wire budget and compatibility evidence
        run: go test ./internal/transport -run '^TestTelemetryWire' -v | tee telemetry-wire.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: telemetry-wire
          path: telemetry-wire.txt
      - name: Incremental configuration comparison
        run: go test ./internal/kernel/xray -run '^$' -bench 'Benchmark(ConfigPreparation|RoutingApply|RuntimeReload)$' -benchtime=20x -benchmem | tee reload-benchmark.txt
      - name: Reporting snapshot allocation comparison
        run: go test ./internal/state -run '^$' -bench '^BenchmarkReportingMetadata$' -benchtime=100x -benchmem | tee reporting-benchmark.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reporting-benchmark
          path: reporting-benchmark.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reload-benchmark
          path: reload-benchmark.txt
      - name: API schemas
        run: |
          python3 -m venv .cache/schema-venv
          .cache/schema-venv/bin/pip install -r scripts/requirements.txt
          go run ./cmd/schema
          .cache/schema-venv/bin/python scripts/check_schema.py
          .cache/schema-venv/bin/python scripts/build_docs.py
          bash -n install.sh scripts/debian-vm.sh scripts/linux-check.sh
          git diff --exit-code -- docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-docs-cloudflare-pages
          path: docs-site/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
  binaries:
    name: Debian binary ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - run: make build-${{ matrix.arch }}
      - name: Ubuntu CLI bootstrap regression
        if: matrix.arch == 'amd64'
        run: |
          stage_dir=$(mktemp -d -t x-node-ubuntu-bootstrap.XXXXXXXX)
          trap 'rm -rf -- "$stage_dir"' EXIT
          printf '%s' 'disposable-ubuntu-bootstrap-token' | dist/xnodectl-linux-amd64 configure --master-url wss://127.0.0.1:65534/v1/agents/connect --config "$stage_dir/bootstrap.json" --token-stdin
          python3 - "$stage_dir/bootstrap.json" <<'PY'
          import json, pathlib, stat, sys
          path = pathlib.Path(sys.argv[1])
          assert json.loads(path.read_text()) == {"master_url": "wss://127.0.0.1:65534/v1/agents/connect", "token": "disposable-ubuntu-bootstrap-token"}
          assert stat.S_IMODE(path.stat().st_mode) == 0o600
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*
  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  debian:
    name: Host ${{ matrix.distribution }} / ${{ matrix.ownership }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: debian
            ownership: nftables-on
          - distribution: debian
            ownership: nftables-off

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/${{ matrix.distribution }}-vm
          key: ${{ matrix.distribution }}-cloud-image-v2
      - name: Install VM tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
      - name: Disposable host verification
        run: bash scripts/debian-vm.sh '${{ matrix.distribution }}' '${{ matrix.ownership }}'
