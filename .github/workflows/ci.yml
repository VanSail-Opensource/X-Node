name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests and schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting and module integrity
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go mod verify
          git diff --check
      - name: Race and real-kernel regressions
        # Xray's VLESS TLS splice paths use uintptr-based field offsets that checkptr rejects.
        run: go test -race -gcflags='github.com/xtls/xray-core/proxy/vless/...=-d=checkptr=0' -count=1 -coverprofile=coverage.out ./...
      - name: Static analysis
        run: go vet ./...
      - name: API schemas
        run: |
          python3 -m venv .cache/schema-venv
          .cache/schema-venv/bin/pip install -r scripts/requirements.txt
          go run ./cmd/schema
          .cache/schema-venv/bin/python scripts/check_schema.py
          .cache/schema-venv/bin/python scripts/build_docs.py
          bash -n install.sh scripts/debian-vm.sh scripts/linux-check.sh
          git diff --exit-code -- docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-docs-cloudflare-pages
          path: docs-site/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
  binaries:
    name: Debian binary ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - run: make build-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*
  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  debian:
    name: Debian 13 host integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/debian-vm
          key: debian-13-cloud-image-v1
      - name: Install VM tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
      - name: Disposable Debian verification
        run: bash scripts/debian-vm.sh
