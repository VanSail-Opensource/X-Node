name: Review tagged Xray updates
on:
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    if: github.repository_id == '1416770902' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - run: python3 scripts/update_xray.py
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: dependencies/xray-tag
          title: Update the pinned Xray release
          body: >-
            Pins the newest upstream release tag by immutable commit.
            Native fields, mux/XUDP lifecycle, accounting and revocation require review and the complete quality gate.
