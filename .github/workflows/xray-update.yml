name: Review tagged Xray updates
on:
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: python3 scripts/update_xray.py
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: dependencies/xray-tag
          title: Update the pinned Xray release
          body: >-
            Pins the newest upstream release tag by immutable commit.
            Native fields, mux/XUDP lifecycle, accounting and revocation require review and the complete quality gate.
