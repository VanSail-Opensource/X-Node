syntax = "proto3";
package xnode.integration;
option go_package = "github.com/VanSail-Opensource/X-Node/internal/kernel/xray";
message ManagerConfig {}
message InboundConfig {
  string native_type = 1;
  bytes native_value = 2;
  string tag = 3;
  bool reality = 4;
}
// Reloadable application features preserve their public core interfaces.
message DNSConfig {
  bytes native_value = 1;
  bool use_local = 2;
}
message PolicyConfig { bytes native_value = 1; }
message RouterConfig { bytes native_value = 1; }
message DispatcherConfig { bytes native_value = 1; }
